<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Escape 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .hero {
      position: relative;
      background-image: url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=1800&q=80&auto=format&fit=crop');
      background-size: cover;
      background-position: center 40%;
      text-align: center;
    }

    /* Dark gradient overlay so text stays readable */
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        rgba(15, 25, 18, 0.55) 0%,
        rgba(15, 25, 18, 0.45) 60%,
        rgba(247, 246, 242, 1) 100%
      );
      z-index: 0;
    }

    .hero .container { position: relative; z-index: 1; }

    /* On the photo, force text colours that work on dark */
    .hero .hero__eyebrow { color: rgba(255,255,255,0.85); }
    .hero .hero__tagline  { color: rgba(255,255,255,0.8); }
    .hero .hero__meta-item {
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.25);
      color: rgba(255,255,255,0.9);
      backdrop-filter: blur(8px);
    }
    .hero .hero__meta-item a { color: inherit; }
    .hero .text-muted { color: rgba(255,255,255,0.65); }

    .hero__meta { justify-content: center; }
    .hero__tagline { max-width: 600px; margin-left: auto; margin-right: auto; }
    .countdown { justify-content: center; }
    .hero h1 .gradient-text {
      background: none;
      -webkit-text-fill-color: #ffffff;
      color: #ffffff;
      text-shadow: 0 2px 16px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>
  <div id="nav-placeholder"></div>

  <div class="page">
    <!-- Hero -->
    <section class="hero">
      <div class="container">
        <p class="hero__eyebrow fade-up">✦ Team Escape · October 2026</p>
        <h1 class="hero__title fade-up fade-up-1">
          <span class="gradient-text" id="event-name">Team Escape 2026</span>
        </h1>
        <p class="hero__tagline fade-up fade-up-2" id="event-tagline"></p>

        <div class="hero__meta fade-up fade-up-2" id="event-meta"></div>

        <div class="fade-up fade-up-3">
          <p class="text-muted text-small" style="margin-bottom:0.75rem;text-transform:uppercase;letter-spacing:0.08em;font-size:0.72rem;text-align:center;">Countdown to departure</p>
          <div class="countdown" id="countdown"></div>
        </div>
      </div>
    </section>

    <!-- Highlights -->
    <section class="section" style="padding-top:0;">
      <div class="container">
        <div class="section__header">
          <h2 class="section__title"><span>🎯</span> What's in store</h2>
        </div>
        <div class="card-grid" id="highlights-grid"></div>
      </div>
    </section>

    <!-- Crew -->
    <section class="section" style="padding-top:0;">
      <div class="container">
        <div class="section__header">
          <h2 class="section__title"><span>👥</span> The crew</h2>
        </div>
        <div class="chips" id="crew-chips"></div>
        <p class="mt-m text-muted text-small">
          <a href="pages/rooms.html">Rooms</a> &nbsp;·&nbsp;
          <a href="pages/cars.html">Transport</a> &nbsp;·&nbsp;
          <a href="pages/meals.html">Meals</a>
        </p>
      </div>
    </section>

    <!-- Organizer & contacts -->
    <section class="section" style="padding-top:0;">
      <div class="container">
        <div class="section__header">
          <h2 class="section__title"><span>📬</span> Questions & contacts</h2>
        </div>

        <div id="organizer-card" class="organizer-card mb-m"></div>
      </div>
    </section>
  </div>

  <div id="footer-placeholder"></div>

  <script src="js/firebase-config.js"></script>
  <script src="js/shared.js"></script>
  <script type="module">
    import { onRegistrations } from './js/db.js';

    (async () => {
      const { event } = await loadAll();

      renderNav(event.name);
      renderFooter();

      document.title = event.name;
      document.getElementById('event-name').textContent = event.name;
      document.getElementById('event-tagline').textContent = event.tagline;

      // Countdown
      startCountdown(event.startDate, 'countdown');

      // Highlights
      document.getElementById('highlights-grid').innerHTML = event.highlights.map(h => `
        <div class="card highlight-card fade-up">
          <span class="highlight-card__icon">${h.icon}</span>
          <div>
            <div class="highlight-card__title">${h.title}</div>
            <p class="text-small">${h.text}</p>
          </div>
        </div>`).join('');

      // Crew — live from Firebase
      onRegistrations(regs => {
        const people = Object.values(regs);
        document.getElementById('event-meta').innerHTML = `
          <span class="hero__meta-item"><span>📅</span>${formatDate(event.startDate)} – ${formatDate(event.endDate)}</span>
          <span class="hero__meta-item"><span>📍</span><a href="${event.location.mapUrl}" target="_blank" style="color:inherit">${event.location.name}, ${event.location.address}</a></span>
          <span class="hero__meta-item"><span>👥</span>${people.length} registered</span>
        `;

        document.getElementById('crew-chips').innerHTML = people.length
          ? people.map(p => `<span class="person-chip"><span class="avatar">${p.emoji}</span>${p.name}</span>`).join('')
          : '<span class="text-muted text-small">No one registered yet — <a href="pages/register.html">be the first!</a></span>';
      });

      // Organizer
      const o = event.organizer;
      document.getElementById('organizer-card').innerHTML = `
        <span class="avatar" style="font-size:1.5rem;width:50px;height:50px;">🧑‍💼</span>
        <div>
          <div style="font-size:0.75rem;text-transform:uppercase;letter-spacing:0.05em;color:var(--c-muted)">Organizer</div>
          <div style="font-weight:700;color:var(--c-heading);font-size:1.05rem;">${o.name}</div>
          <div class="text-small text-muted">
            <a href="mailto:${o.email}">${o.email}</a> &nbsp;·&nbsp;
            <a href="tel:${o.phone}">${o.phone}</a>
          </div>
        </div>
      `;

      // Emergency contacts removed
    })();
  </script>
</body>
</html>
